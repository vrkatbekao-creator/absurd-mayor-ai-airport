name: v0.2.1 municipal action regression
on:
  push:
    branches:
      - feature/municipal-actions-v021
  pull_request:
    paths:
      - '荒謬市長_v0.2.html'
      - 'tests/*regression.test.cjs'
      - '.github/workflows/municipal-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current in-page rules and save compatibility
        run: node --test tests/municipal-regression.test.cjs
