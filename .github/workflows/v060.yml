name: V0.6.0 map-first acceptance
on:
  pull_request:
    paths:
      - '荒謬市長_v0.6.0.html'
      - 'assets/v060*'
      - 'scripts/*v060*'
      - 'tests/*v060*'
      - '.github/workflows/v060.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce offline HTML and preserve releases
        run: |
          python3 scripts/build-v060.py
          git diff --exit-code -- 荒謬市長_v0.6.0.html
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          const data=JSON.parse(fs.readFileSync('qa/releases-v060.json'));
          for(const [file,expected] of Object.entries(data)){assert.equal(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),expected,file)}
          JS
      - run: node --test tests/finance-v060.test.cjs tests/startup-v060.test.cjs tests/narrative-v060.test.cjs
      - run: node scripts/regression-v060.cjs --seeds=2000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v060-core-and-paired-regression
          path: artifacts/regression-v0.6.0.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install system dependencies with bounded retries
        timeout-minutes: 7
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80mayor-ci
          npx playwright install-deps ${{ matrix.browser }}
      - name: Download browser with bounded retries
        timeout-minutes: 7
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: |
          for attempt in 1 2 3; do
            if timeout 120s npx playwright install ${{ matrix.browser }}; then exit 0; fi
          done
          exit 1
      - run: npx playwright test -c tests/v060-playwright.config.cjs --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v060-browser-${{ matrix.browser }}
          path: |
            artifacts/v060-screenshots/
            artifacts/v060-test-results/
          retention-days: 14
