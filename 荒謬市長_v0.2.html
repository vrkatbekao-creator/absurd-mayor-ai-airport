function totals(){let traffic=s.tiles.reduce((n,t)=>n+t.traffic,0), supply=5, demand=0, ai=0, income=0;for(const t of s.tiles){if(t.type==='power')supply+=5;if(t.type==='original'&&t.name==='舊變電站')supply+=3;if(builds[t.type]){let b=builds[t.type];demand+=Math.max(0,b.power);ai+=b.ai;if(t.type==='market')income+=3}}return {traffic,supply,demand,ai,income,airportIncome:Math.floor(traffic/10)}}

let card=cards[s.order[(s.turn-1)%cards.length]];if(s.phase==='policy'){$('action').innerHTML=`<div class="event"><div class="tag">今日政策事件 / POLICY ${String(s.turn).padStart(2,'0')}</div><h4>${card[0]}</h4><p>${card[1]}</p></div><div class="choices">${card[2].map((c,i)=>`<button class="choice" data-policy="${i}"><b>${c[0]} →</b><small>${c[1]}</small></button>`).join('')}</div>`}else if(s.phase==='build'){let tile=s.selected===null?null:s.tiles[s.selected];$('action').innerHTML=`<div class="event"><div class="tag">園區建設 / DEVELOPMENT</div><h4>${tile?'改造「'+tile.name+'」':'選擇一個地塊'}</h4><p>${tile?'拆除會失去此格原有的吞吐量。建築可被替換，但不退還成本。':'請先點選左側地圖。保留與維護也是一種地塊行動。'}</p></div>${tile?`<div class="choices"><button class="choice" data-build="maintain"><b>維護現有設施 →</b><small>花費 2；保留地塊與目前的產出</small></button>${Object.entries(builds).map(([k,b])=>`<button class="choice" data-build="${k}"><b>${b.icon} ${b.name} →</b><small>${b.desc}${tile.traffic?'；失去吞吐量 '+tile.traffic:''}</small></button>`).join('')}</div>`:''}`}else{$('action').innerHTML=`<div class="event"><div class="tag">回合結算 / SETTLEMENT</div><h4>準備好面對數字了嗎？</h4><p>本回合預計機場收入 +${t.airportIncome}、商業收入 +${t.income}、基本支出 −4。${t.demand>t.supply?'電力不足，AI 建築產出減半且民意 −3。':'供電足夠，AI 建築正常運作。'}</p></div><button class="primary" id="settle">結算第 ${s.turn} 回合 →</button>`}

function policy(i){if(s.phase!=='policy')return;let c=cards[s.order[s.turn-1]][2][i];change(c[2]);if(c[3])s.queue.push({due:s.turn+c[3][0],effect:c[3][1],text:c[3][2]});s.news='《市民之聲》：'+c[0]+'；市府表示一切都在計畫之中。';addlog('政策：'+c[0]+'。');s.phase='build';render()}
function build(k){if(s.phase!=='build'||s.selected===null)return;let tile=s.tiles[s.selected];if(k==='maintain'){s.money-=2;addlog('維護'+tile.name+'，財政 −2。')}else{let b=builds[k],lost=tile.traffic;s.money-=b.cost;s.hype+=b.hype;if(k==='power')s.pop-=3;if(k==='park')s.pop+=5;if(tile.type==='original'&&['保護林','機場社區','鴿子棲地'].includes(tile.name)&&k!=='park')s.pop-=3;s.tiles[s.selected]={icon:b.icon,name:b.name,traffic:0,type:k};addlog('在'+tile.name+'興建'+b.name+'，失去吞吐量 '+lost+'。')}s.phase='settle';s.selected=null;render()}
function settle(){if(s.phase!=='settle')return;let t=totals(),short=t.demand>t.supply,produced=short?Math.floor(t.ai/2):t.ai;change({money:t.airportIncome+t.income-4,ai:produced,pop:(short?-3:0)+(s.debt>=6?-2:0)});let due=s.queue.filter(q=>q.due===s.turn);for(let q of due){change(q.effect);addlog('延遲後果：'+q.text)}s.queue=s.queue.filter(q=>q.due>s.turn);s.last=`機場收入 +${t.airportIncome}、商業收入 +${t.income}、支出 −4；AI 實績 +${produced}${short?'（供電不足）':''}。`;addlog(s.last);if(s.turn===12){s.finished=true;s.phase='done'}else{s.turn++;s.phase='policy';s.news=short?'《科技觀察》：園區停電，官方稱這是「離線智慧」。':'《大餅日報》：轉型持續進行，機場的未來已經登機。'}render()}
function ending(){let t=totals(),parks=s.tiles.filter(x=>x.type==='park').length,kind,desc;if(t.demand>t.supply){kind='全球最大暖氣機';desc='資料中心排成一列，電表跑得比飛機還快。園區的主要產出是熱量。'}else if(s.ai>=50&&s.money>=0&&s.pop>=35){kind='AI 奇蹟・新矽谷';desc='園區終於交出了真實成果。舊機場的損失依然存在，但新產業確實站穩了腳步。'}else if(parks>=3){kind='鴿子共和國';desc='公聽會的常客終於獲勝。市府宣布這是全球第一座鳥類主導的智慧園區。'}else if(s.hype>=45&&s.hype>s.ai*1.3){kind='PPT 科技城';desc='園區的投影片產量世界第一。至於真正的企業，招商簡報說「即將進駐」。'}else{kind='全球第一座沒有飛機的航空城';desc='機場被改造，AI 成果仍不足以補上缺口。市府開始研究重建跑道的可能性。'}let met=[s.ai>=50,parks>=2&&t.demand<=t.supply,s.money>=65].filter(Boolean).length;$('modal').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="endtitle"><div class="eyebrow">任期結束 / FINAL REPORT</div><h2 id="endtitle">${kind}</h2><p>${desc}</p><div class="result"><p><b>任期成績</b>　財政 ${s.money}　民意 ${s.pop}　AI 實績 ${s.ai}　大餅 ${s.hype}</p><p>機場吞吐量 ${t.traffic} / 80，機場每回合收入 ${t.airportIncome} / 8。</p><p>競選承諾達成 ${met} / 3；政見債務 ${s.debt}。${s.queue.length?'尚有 '+s.queue.length+' 件延遲後果留給下一任。':''}</p></div><p class="muted">結局依序檢查供電、AI 成果、綠地與宣傳；其餘情況為航空城結局。</p><button class="primary" id="restartEnd">再當一次市長 →</button></section></div>`}
function intro(){$('modal').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="introtitle"><div class="eyebrow">大餅市政府 · 新任市長簡報</div><h2 id="introtitle">飛機還在飛，<br>市長已經宣布關閉。</h2><p>大餅國際機場原本繁忙而且賺錢。市長參加科技論壇後，決定將它改建為全球第一的 AI 園區。政策已經宣布；你有 12 回合處理後果。</p><ul><li>每回合先選一張政策選項，再選地塊建設或維護，最後結算。</li><li>機場設施在過渡期仍帶來收入；改建會永久損失吞吐量與未來收入。</li><li>電力不足會使 AI 每回合產出減半；高政見債務會侵蝕民意。</li><li>財政可以為負，遊戲固定進行 12 回合。畫面會在此瀏覽器自動存檔。</li></ul><button class="primary" id="start">開始施政 →</button></section></div>`}

function newGame(){return {version:2,turn:1,phase:'policy',money:65,pop:60,ai:0,hype:10,debt:3,tiles:initialTiles.map(([icon,name,traffic])=>({icon,name,traffic,type:'original'})),order:shuffleV([...cards.keys()]),selected:null,queue:[],lost:0,aiValue:0,spent:0,private:0,deficit:0,distressTurns:0,adminUsed:{},deferred:0,revised:false,loan:false,milestones:[],log:[],finished:false}}
function valid(v){return v&&v.version===2&&Number.isInteger(v.turn)&&v.turn>=1&&v.turn<=12&&['policy','build','settle','done'].includes(v.phase)&&Array.isArray(v.tiles)&&v.tiles.length===9&&v.tiles.every((x,i)=>x&&['original',...Object.keys(builds)].includes(x.type)&&typeof x.icon==='string'&&typeof x.name==='string'&&Number.isFinite(x.traffic)&&x.traffic>=0&&x.traffic<81&&(x.type!=='original'||x.name===initialTiles[i][1]&&x.traffic===initialTiles[i][2]))&&Array.isArray(v.order)&&v.order.length===15&&new Set(v.order).size===15&&v.order.every(x=>Number.isInteger(x)&&x>=0&&x<15)&&Array.isArray(v.queue)&&v.queue.every(q=>q&&Number.isInteger(q.due)&&q.due>0&&q.effect&&Object.entries(q.effect).every(([k,n])=>['money','pop','ai','hype','debt'].includes(k)&&Number.isFinite(n)))&&Array.isArray(v.log)&&v.log.every(x=>x&&['policy','build','upgrade','admin','defer','milestone','settlement'].includes(x.kind)&&(x.kind!=='policy'||Number.isInteger(x.card)&&x.card>=0&&x.card<15&&Number.isInteger(x.option)&&x.option>=0&&x.option<cards[x.card][2].length)&&(x.kind!=='build'||x.type==='maintain'||!!builds[x.type])&&(x.kind!=='milestone'||!!M[x.key]))&&Array.isArray(v.milestones)&&v.milestones.every(x=>x&&['milestone4a','milestone4b','milestone8a','milestone8b','milestone12'].includes(x.key))&&(v.selected===null||Number.isInteger(v.selected)&&v.selected>=0&&v.selected<9)&&(!v.adminUsed||(typeof v.adminUsed==='object'&&!Array.isArray(v.adminUsed)&&Object.keys(v.adminUsed).every(k=>['consult','research','investment','audit'].includes(k)&&v.adminUsed[k]===true)))&&(!('deferred' in v)||Number.isInteger(v.deferred)&&v.deferred>=0)&&v.tiles.every(t=>t.level===undefined||t.level===1||t.level===2)&&typeof v.finished==='boolean'&&typeof v.loan==='boolean'&&typeof v.revised==='boolean'&&['money','pop','ai','hype','debt','lost','aiValue','spent','private','deficit','distressTurns'].every(k=>Number.isFinite(v[k]))}
let game,notice='';try{let raw=localStorage.getItem(VKEY);if(raw){let obj=JSON.parse(raw);if(valid(obj))game=obj;else notice='invalid'}else if(localStorage.getItem(KEY))notice='pendingOld'}catch(_){notice='invalid'}if(!game)game=newGame();game.adminUsed=game.adminUsed||{};game.deferred=game.deferred||0;game.tiles.forEach(t=>{if(t.type!=='original'&&!t.level)t.level=1});

function metrics(g=game){let nominal=g.tiles.reduce((n,t)=>n+t.traffic,0),traffic=g.tiles[1].type==='original'&&g.tiles[2].type==='original'?nominal:0,supply=5,demand=0,ai=0,biz=0;g.tiles.forEach(t=>{if(t.type==='original'&&t.name==='舊變電站')supply+=3;if(t.type==='power')supply+=5;if(builds[t.type]){const b=builds[t.type],up=(t.level||1)===2;demand+=Math.max(0,b.power)+(up&&b.ai>0?1:0);ai+=b.ai+(up?Math.ceil(b.ai/2):0);if(up&&t.type==='power')supply+=3;if(t.type==='market')biz+=3+(up?1:0)}});return {nominal,traffic,airport:Math.floor(traffic/10),supply,demand,ai,biz,redeveloped:g.tiles.slice(0,5).filter(t=>t.type!=='original').length,parks:g.tiles.filter(t=>t.type==='park').length}}

function choosePolicy(g,i){if(g.phase!=='policy')return;let idx=g.order[g.turn-1],c=cards[idx][2][i];if(!c)return;apply(g,c[2]);if(idx===1&&i===0)g.private+=12;if(c[3])g.queue.push({due:g.turn+c[3][0],effect:c[3][1],card:idx,option:i});g.log.unshift({turn:g.turn,kind:'policy',card:idx,option:i});g.log=g.log.slice(0,8);g.phase='build'}

function develop(g,idx,type){if(g.phase!=='build'||idx===null||idx<0||idx>8||!builds[type]||g.tiles[idx].type!=='original')return false;const old=g.tiles[idx],b=builds[type];g.money-=b.cost;g.spent+=b.cost;g.hype+=b.hype;if(type==='power')g.pop-=3;if(type==='park')g.pop+=5;if(['保護林','機場社區','鴿子棲地'].includes(old.name)&&type!=='park')g.pop-=3;g.tiles[idx]={icon:b.icon,name:b.name,traffic:0,type,level:1};g.pop=Math.max(0,Math.min(100,g.pop));finishAction(g,'build',{plot:idx,type});return true}

let actionView='land';
function previewMunicipal(g,i,type,upgrading){
  const before=metrics(g),copy={...g,tiles:g.tiles.map(t=>({...t}))};
  if(upgrading)copy.tiles[i].level=2;
  else copy.tiles[i]={...copy.tiles[i],type,traffic:0,level:1};
  const after=metrics(copy),t=UX[lang];
  return t.forecast+': '+t.airport+' '+before.airport+'→'+after.airport+
    ' · '+t.grid+' '+(before.supply-before.demand)+'→'+(after.supply-after.demand)+
    ' · '+t.production+' '+before.ai+'→'+after.ai;
}
function promiseAudit(){
  const m=metrics(),v=promises(),t=UX[lang];
  const rows=[
    [t.jobs,t.measureJobs+': '+game.ai+'/50',v[0]],
    [t.climate,t.measureClimate+': '+m.parks+'/2; '+t.grid+' '+(m.supply-m.demand),v[1]],
    [t.public,t.measurePublic+': '+game.spent+'; '+msg('private')+': '+game.private,v[2]]
  ];
  return '<section class="audit"><h3>'+t.audit+'</h3><p class="hint">'+t.proxy+'</p>'+
    rows.map(x=>'<div class="audit-row"><b>'+x[0]+'</b><span>'+x[1]+'</span><strong>'+msg(x[2]?'yes':'no')+'</strong></div>').join('')+'</section>';
}
function drawV2(){let m=metrics(),p=promises();document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=msg('title');document.querySelector('h1').textContent=msg('title');document.querySelector('.seal').textContent=lang==='zh'?'大餅':'DB';document.querySelector('.seal').setAttribute('aria-label',({zh:'大餅市政府',en:'Dabing City government',fr:'Ville de Dabing',nl:'Stadsbestuur van Dabing'})[lang]);document.querySelector('.topright').innerHTML=`<button class="reset" data-v2="restart">${msg('restart')}</button>`;document.querySelector('.eyebrow').textContent='DABING CITY · DEVELOPMENT BUREAU';document.querySelector('.hero h2').textContent=msg('phaseIntro');document.querySelector('.hero .eyebrow').textContent=UX[lang].acts[Math.min(2,Math.floor((game.turn-1)/4))];document.querySelector('.hero p').textContent=msg('units');document.querySelector('.round').innerHTML=`${msg('round')} <b>${String(game.turn).padStart(2,'0')}</b> / 12`;
let vals=[[msg('money'),game.money],[msg('traffic'),m.traffic+' / 80'],[msg('pop'),game.pop],[msg('ai'),game.ai],[msg('hype'),game.hype],[msg('power'),m.supply-m.demand]];document.getElementById('stats').innerHTML=vals.map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('');let last=game.milestones.at(-1);document.getElementById('news').textContent=last?msg(last.key):msg('intro');document.querySelector('.news b').textContent=lang==='zh'?'即時新聞':lang==='en'?'NEWS':lang==='fr'?'ACTUALITÉS':'NIEUWS';document.getElementById('stats').setAttribute('aria-label',msg('outcome'));
let map=document.getElementById('map');map.innerHTML=game.tiles.map((tile,i)=>`<button class="tile ${tile.type!=='original'?'built':''} ${game.selected===i?'selected':''}" data-v2="tile" data-index="${i}" aria-pressed="${game.selected===i}" aria-label="${esc(loc(tile.name)+' — '+msg('nominal')+': '+tile.traffic)}" title="${esc(loc(tile.name))}"><span class="icon">${tile.icon} ${game.selected===i?'✓':''}</span><strong><span class="tile-name-full">${esc(loc(tile.name))}</span><span class="tile-name-short" aria-hidden="true">${esc(shortTileName(tile.name))}</span></strong><small>${msg('nominal')}: ${tile.traffic}</small></button>`).join('');document.querySelector('.panelhead h3').textContent=loc('機場改建地圖');document.querySelector('.panelhead p').textContent=loc('點選一個地塊，再決定它的未來。');document.querySelector('.panelhead .badge').textContent='3 × 3';document.getElementById('maphint').textContent=msg('rules');document.getElementById('phases').innerHTML=['policy','build','settle'].map((k,i)=>`<span class="${game.phase===k?'active':''}">0${i+1} ${msg(k)}</span>`).join('');
let action=document.getElementById('action'),card=cards[game.order[game.turn-1]];if(game.phase==='policy'){action.innerHTML=`<div class="event"><div class="tag">${msg('policy')}</div><h4>${loc(card[0])}</h4><p>${loc(card[1])}</p></div><div class="choices">${card[2].map((o,i)=>`<button class="choice" data-v2="policy" data-index="${i}"><b>${loc(o[0])} →</b><small>${optionEffect(o)}</small></button>`).join('')}</div>`}else if(game.phase==='build'){let idx=game.selected,tile=idx===null?null:game.tiles[idx],after=tile&&tile.type==='original'?preview(game,idx):null;
const admins=Object.entries(municipal).map(([k,a])=>`<button class="choice" data-v2="admin" data-type="${k}" ${game.adminUsed[k]?'disabled':''}><b>${am(k)} ${game.adminUsed[k]?'('+am('taken')+')':''}</b><small>${msg('cost')}: ${a.cost}; ${msg('pop')}: ${a.pop>=0?'+':''}${a.pop}; ${msg('ai')}: +${a.ai}; ${msg('debt')}: ${a.debt>=0?'+':''}${a.debt}</small></button>`).join('');
const slot=tile?(tile.type==='original'? `<div class="event"><h4>${loc(tile.name)} · ${am('build')}</h4><p>${msg('proposal')}: ${m.traffic} → ${after.traffic}/80; ${msg('income')}: ${m.airport} → ${after.airport}.</p></div><div class="choices">${Object.entries(builds).map(([k,b])=>`<button class="choice" data-v2="build" data-type="${k}"><b>${b.icon} ${loc(b.name)} →</b><small>${msg('cost')}: ${b.cost} · ${msg('aiEach')}: +${b.ai} · ${msg('demand')}: ${b.power>0?'+'+b.power:b.power} · ${msg('hype')}: +${b.hype}</small><small class="forecast">${previewMunicipal(game,idx,k,false)}</small></button>`).join('')}</div>` : `<div class="event"><h4>${loc(tile.name)} · ${am('level')} ${tile.level||1}/2</h4><p>${am('originalOnly')}</p></div>${(tile.level||1)<2?`<button class="choice" data-v2="upgrade" style="width:100%"><b>${am('upgrade')} · ${msg('cost')}: ${Math.max(5,Math.ceil(builds[tile.type].cost*.6))}</b><small>${am('upgradeEffect')}</small><small class="forecast">${previewMunicipal(game,idx,tile.type,true)}</small></button>`:`<p class="hint">${am('atMax')}</p>`}`) : `<div class="event"><h4>${msg('build')}</h4><p>${am('choose')}</p></div>`;
const t=UX[lang];const tabs='<nav class="action-tabs" aria-label="'+am('choose')+'">'+
[['land',t.land],['admin',t.administration],['defer',t.delay]].map(x=>'<button type="button" class="action-tab '+(actionView===x[0]?'active':'')+'" data-v2="action-tab" data-tab="'+x[0]+'" aria-pressed="'+(actionView===x[0])+'">'+x[1]+'</button>').join('')+'</nav>';
const body=actionView==='admin'?'<h4 class="municipal-head">'+am('municipal')+'</h4><div class="choices">'+admins+'</div>':
 actionView==='defer'?'<button class="choice" data-v2="defer" style="width:100%"><b>'+am('defer')+'</b><small>'+am('defCost')+'</small></button>':slot;
action.innerHTML=tabs+body
}else if(game.phase==='settle'){action.innerHTML=`<div class="event"><h4>${msg('settle')}</h4><p>${msg('income')}: +${m.airport}; ${msg('aiEach')}: +${m.demand>m.supply?Math.floor(m.ai/2):m.ai}; ${msg('debtRule')}</p></div><button class="primary" data-v2="settle">${msg('settleBtn')} →</button>`}else action.innerHTML='';
let left=document.getElementById('promises');left.parentElement.querySelector('h3').textContent=msg('actions');left.innerHTML=[`${msg('debt')}: <b>${game.debt}</b>`,`${msg('promise1')}: ${msg(p[0]?'yes':'no')}`,`${msg('promise2')}: ${msg(p[1]?'yes':'no')}`,`${msg('promise3')}: ${msg(p[2]?'yes':'no')}`,game.revised?msg('revised'):`<button class="choice" data-v2="revise">${msg('revise')}</button>`,!game.loan?`<button class="choice" data-v2="loan">${msg('recovery')}</button>`:'',`${msg('crisis')}: ${game.deficit}`,`${msg('pending')}: ${game.queue.length?game.queue.map(q=>`${msg('due')} ${q.due}: ${eff(q.effect)}`).join('; '):msg('none')}`].filter(Boolean).map(x=>`<li>${x}</li>`).join('');let right=document.getElementById('log');right.parentElement.querySelector('h3').textContent=msg('events');right.innerHTML=[`${msg('airport')}: 8 / ${m.airport}`,`${msg('nominal')}: ${m.nominal} / 80`,`${msg('lost')}: ${game.lost}`,`${msg('aiValue')}: ${game.aiValue}`,`${msg('spend')}: ${game.spent}`,`${msg('private')}: ${game.private}`,`${msg('redevelop')}: ${m.redeveloped} / 5`,...game.log.slice(0,4).map(x=>`${msg('round')} ${x.turn}: ${x.kind==='policy'?loc(cards[x.card][2][x.option][0]):x.kind==='build'?loc(builds[x.type].name):x.kind==='upgrade'?am('upgrade')+' '+loc(builds[x.type].name):x.kind==='admin'?am(x.key):x.kind==='defer'?am('defer'):x.kind==='milestone'?msg(x.key):`${msg('income')} +${x.airport}; ${msg('aiEach')} +${x.production}; ${msg('financing')} −${x.fee}`}`)].map(x=>`<li>${x}</li>`).join('');persist();if(game.finished)showEnd()}
function showEnd(){let m=metrics(),k=endingKey(),e=endInfo[k],desc=k==='airport'&&m.traffic===80?msg('epilogueOpen'):k==='airport'&&m.traffic>0?msg('epiloguePartial'):loc(e[1]),title=k==='airport'&&m.traffic>0?msg('turnaround'):loc(e[0]);document.getElementById('modal').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="endtitle"><div class="eyebrow">${msg('outcome')}</div><h2 id="endtitle">${title}</h2><p>${desc}</p><div class="result"><p>${msg('money')}: ${game.money} · ${msg('pop')}: ${game.pop} · ${msg('debt')}: ${game.debt}</p><p>${msg('traffic')}: ${m.traffic}/80 · ${msg('redevelop')}: ${m.redeveloped}/5</p><p>${msg('lost')}: ${game.lost} · ${msg('aiValue')}: ${game.aiValue}</p><p>${msg('spend')}: ${game.spent} · ${msg('private')}: ${game.private}</p><p>${msg('fulfilled')}: ${promises().filter(Boolean).length}/3</p></div>${promiseAudit()}<p>${msg('endHelp')}</p><button class="primary" data-v2="restart">${msg('restart')}</button></section></div>`}
function showIntro(key){document.getElementById('modal').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="introtitle"><h2 id="introtitle">${msg('title')}</h2>${key?`<p><b>${msg(key)}</b></p>`:''}<p>${msg('intro')}</p><p>${msg('rules')}</p><p>${msg('debtRule')}</p><p>${msg('endHelp')}</p><button class="primary" data-v2="close">${msg('start')}</button></section></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('[data-v2]');if(!b)return;let a=b.dataset.v2;if(a==='close')document.getElementById('modal').innerHTML='';if(a==='policy'){choosePolicy(game,Number(b.dataset.index));actionView='land'}if(a==='action-tab'&&game.phase==='build')actionView=b.dataset.tab;if(a==='tile'&&game.phase==='build'){game.selected=Number(b.dataset.index);actionView='land'}if(a==='build')develop(game,game.selected,b.dataset.type);if(a==='upgrade')upgrade(game,game.selected);if(a==='admin')administration(game,b.dataset.type);if(a==='defer')deferAction(game);if(a==='settle')doSettle(game);if(a==='revise'&&!game.revised&&!game.finished){game.revised=true;apply(game,{pop:-4,debt:-2})}if(a==='loan'&&!game.loan&&!game.finished){game.loan=true;apply(game,{money:15,debt:2});game.queue.push({due:game.turn+1,effect:{money:-9}},{due:game.turn+2,effect:{money:-9}})}if(a==='restart'&&confirm(msg('confirm'))){game=newGame();document.getElementById('modal').innerHTML='';drawV2();showIntro();return}drawV2()});
